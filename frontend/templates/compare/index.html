{% extends "base.html" %}
{% block title %}Compare EVs — EV Cold Weather Modeler{% endblock %}
{% block page_title %}📈 Comparative EV Analysis{% endblock %}
{% block content %}
<div class="animate-fade">
    <div class="card" style="margin-bottom:20px;">
        <div class="card-header"><h3 class="card-title">Select Vehicles to Compare</h3></div>
        <form onsubmit="submitComparison(event)">
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:16px;">
                {% for v in vehicles %}
                <label class="form-check" style="padding:10px;background:var(--bg-primary);border-radius:var(--radius-sm);border:1px solid var(--border-color);">
                    <input type="checkbox" name="vehicle_ids" value="{{ v.id }}">
                    <span style="font-size:13px;color:var(--text-primary);font-weight:600;">{{ v.manufacturer }} {{ v.model_name }}</span>
                    <span style="font-size:11px;color:var(--text-muted);display:block;margin-left:26px;">{{ v.battery_capacity_kwh }} kWh · {{ v.battery_chemistry }}</span>
                </label>
                {% endfor %}
            </div>
            <div style="display:flex;gap:12px;align-items:end;">
                <div class="form-group" style="width:200px;margin-bottom:0;">
                    <label class="form-label">Temperature (°C)</label>
                    <input type="number" id="compareTemp" class="form-control" value="-10" step="1">
                </div>
                <button type="submit" class="btn btn-primary" style="margin-bottom:0;">📊 Compare</button>
            </div>
        </form>
    </div>
    <div id="comparisonResult"></div>
</div>
{% endblock %}
