{% extends "base.html" %}
{% block title %}Edit Vehicle — EV Cold Weather Modeler{% endblock %}
{% block page_title %}✏️ Edit {{ vehicle.manufacturer }} {{ vehicle.model_name }}{% endblock %}
{% block content %}
<div style="max-width:700px;" class="animate-fade">
    <div class="card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Manufacturer *</label>
                    <input type="text" name="manufacturer" class="form-control" value="{{ vehicle.manufacturer }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Model Name *</label>
                    <input type="text" name="model_name" class="form-control" value="{{ vehicle.model_name }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Battery Capacity (kWh) *</label>
                    <input type="number" name="battery_capacity_kwh" class="form-control" value="{{ vehicle.battery_capacity_kwh }}" step="0.1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">EPA Range (km) *</label>
                    <input type="number" name="epa_range_km" class="form-control" value="{{ vehicle.epa_range_km }}" step="0.1" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Vehicle Weight (kg) *</label>
                    <input type="number" name="vehicle_weight_kg" class="form-control" value="{{ vehicle.vehicle_weight_kg }}" step="0.1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Battery Chemistry *</label>
                    <select name="battery_chemistry" class="form-control" required>
                        <option value="NMC" {% if vehicle.battery_chemistry == 'NMC' %}selected{% endif %}>NMC</option>
                        <option value="LFP" {% if vehicle.battery_chemistry == 'LFP' %}selected{% endif %}>LFP</option>
                        <option value="NCA" {% if vehicle.battery_chemistry == 'NCA' %}selected{% endif %}>NCA</option>
                        <option value="LMO" {% if vehicle.battery_chemistry == 'LMO' %}selected{% endif %}>LMO</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Charging Type *</label>
                    <input type="text" name="charging_type" class="form-control" value="{{ vehicle.charging_type }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Max Charging Power (kW)</label>
                    <input type="number" name="max_charging_power_kw" class="form-control" value="{{ vehicle.max_charging_power_kw or '' }}" step="0.1">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Drivetrain</label>
                    <select name="drivetrain" class="form-control">
                        <option value="">-- Select --</option>
                        <option value="FWD" {% if vehicle.drivetrain == 'FWD' %}selected{% endif %}>FWD</option>
                        <option value="RWD" {% if vehicle.drivetrain == 'RWD' %}selected{% endif %}>RWD</option>
                        <option value="AWD" {% if vehicle.drivetrain == 'AWD' %}selected{% endif %}>AWD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Year</label>
                    <input type="number" name="year" class="form-control" value="{{ vehicle.year or '' }}">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Energy Consumption (Wh/km)</label>
                <input type="number" name="energy_consumption_wh_km" class="form-control" value="{{ vehicle.energy_consumption_wh_km or '' }}" step="0.1">
            </div>
            <div style="display:flex;gap:10px;margin-top:20px;">
                <button type="submit" class="btn btn-primary">💾 Update Vehicle</button>
                <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-outline">← Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
